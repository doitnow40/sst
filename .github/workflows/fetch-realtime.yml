# .github/workflows/fetch-realtime.yml
#
# KR + US 섹터 데이터 수집 → Cloudflare KV + GAS 시트 동기화
#
# ── KR 수집 ────────────────────────────────────────────────────────
#   KST 09:00~15:55 (UTC 00:00~06:55) 평일 5분마다
#   네이버 API → KV kr_today / kr_stocks → GAS KR 시트
#
# ── US 수집 ────────────────────────────────────────────────────────
#   ET 09:30~16:00 (UTC 13:30~21:00) 평일 5분마다
#   Yahoo Finance → KV us_watch_today / us_watch_stocks → GAS US 시트
#
# ── 장마감/휴일/연휴 ─────────────────────────────────────────────────
#   KV TTL: 다음 영업일까지 유지 → 웹사이트 항상 최근 종가 표시
#
# ── GitHub Secrets ──────────────────────────────────────────────────
#   GAS_WEBAPP_URL      CF_ACCOUNT_ID  CF_API_TOKEN
#   CF_KV_NAMESPACE_ID  UPDATE_TOKEN

name: Fetch Realtime KR+US Data

on:
  schedule:
    # ── KR 장중: UTC 00:00~06:55 평일 5분 ──
    - cron: '*/5 0-6 * * 1-5'
    # ── US 장중: UTC 13:30~21:00 평일 5분 ──
    - cron: '*/5 13-20 * * 1-5'
    - cron: '30-59/5 13 * * 1-5'   # 13:30부터 시작
    - cron: '0-0/5 21 * * 1-5'     # 21:00까지 (16:00 ET)

  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch_naver.py
        env:
          GAS_WEBAPP_URL:     ${{ secrets.GAS_WEBAPP_URL }}
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          UPDATE_TOKEN:       ${{ secrets.UPDATE_TOKEN }}
        run: python scripts/fetch_naver.py
