# .github/workflows/fetch-realtime.yml
#
# ⚠️  이 워크플로우는 Cloudflare Workers Cron으로 대체되어 비활성화됨
#
# 이전 역할: 한국 주식 장중 5분 주기로 네이버 API 데이터 수집 → Cloudflare KV 저장
# 현재 역할: workers/realtime-proxy.js 의 scheduled 핸들러가 동일 작업 수행
#
# Cloudflare Cron 장점:
#   - GitHub Actions cron 대비 정확한 실행 보장 (지연/누락 없음)
#   - GitHub Secrets (CF_ACCOUNT_ID, CF_API_TOKEN, CF_KV_NAMESPACE_ID) 불필요
#   - GAS_WEBAPP_URL은 Worker Secret으로 관리 (npx wrangler secret put GAS_WEBAPP_URL)
#
# 이 파일은 삭제해도 무방하나, 참고용으로 보존

name: Fetch Realtime KR Data (DISABLED - replaced by CF Cron)

on:
  # schedule 비활성화 - Cloudflare Cron이 대신 실행
  # - cron: '*/5 0-6 * * 1-5'

  # 수동 실행은 유지 (긴급 디버깅용)
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "이 워크플로우는 비활성화되었습니다."
          echo "데이터 수집은 Cloudflare Workers Cron이 담당합니다."
          echo "workers/realtime-proxy.js 의 scheduled 핸들러를 확인하세요."
