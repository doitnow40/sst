# wrangler.toml
# Cloudflare Worker + KV + Cron 설정
#
# ── 배포 순서 ────────────────────────────────────────────────
#   1. KV namespace가 없다면:
#      npx wrangler kv:namespace create "REALTIME_KV"
#      → 출력된 id를 아래 [[kv_namespaces]] id에 붙여넣기
#      (기존에 이미 생성한 경우 현재 id 그대로 사용)
#
#   2. GAS_WEBAPP_URL을 Worker Secret으로 등록:
#      npx wrangler secret put GAS_WEBAPP_URL
#      → 프롬프트에 GAS 웹앱 URL 입력
#
#   3. 배포:
#      npx wrangler deploy
#
#   4. GitHub Actions fetch-realtime.yml 비활성화 (선택):
#      .github/workflows/fetch-realtime.yml 파일 삭제 또는
#      on.schedule 블록 제거
#
# ── GitHub Actions Secrets 정리 ──────────────────────────────
#   CF_ACCOUNT_ID, CF_API_TOKEN, CF_KV_NAMESPACE_ID 는
#   Cloudflare Cron 전환 후 더 이상 필요 없음
#   (GAS_WEBAPP_URL도 Worker Secret으로 이전됨)

name = "stock-sector-tracker"
main = "workers/realtime-proxy.js"
compatibility_date = "2024-01-01"

# ── KV 바인딩 ────────────────────────────────────────────────
[[kv_namespaces]]
binding = "REALTIME_KV"
id = "1fc0b0b7b18049e3b057ed56442d5404"   # ← 실제 KV namespace ID로 교체

# ── Cron 트리거 ──────────────────────────────────────────────
# UTC 기준: 00:00~06:55, 평일(월~금), 5분 간격
# KST 환산: 09:00~15:55 (장중 전체 커버)
# Cloudflare Cron은 GitHub Actions와 달리 지연/누락 없이 정확히 실행됨
[triggers]
crons = ["*/5 0-7 * * 1-5"]
